name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e kvrm-core/ -e kvrm-bench/
          for d in kvrm-demos/*/; do
            if [ -f "${d}pyproject.toml" ]; then
              pip install -e "$d"
            fi
          done
          pip install pytest

      - name: Run test suite
        run: python -m pytest tests kvrm-demos -q --ignore=tests/baselines

      - name: Publication readiness check
        run: python kvrm-bench/scripts/run_publication_check.py
