<text x='375' y='197' font-family='Inter, Helvetica, Arial, sans-serif' font-size='10' font-weight='400' text-anchor='middle' fill='#1a1a2e'>Abstain / Fallback</text>
<line x1='300' y1='145' x2='375' y2='175' stroke='#e53935' stroke-width='1.5' stroke-dasharray='4,3' marker-end='url(#arrow4)'/>
<text x='370' y='168' font-family='Inter, Helvetica, Arial, sans-serif' font-size='9' font-weight='700' text-anchor='start' fill='#e53935'>Unsupported</text>
