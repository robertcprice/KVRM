[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvrm-core"
version = "0.1.0"
description = "KVRM core runtime for bounded decisions over audited finite action spaces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "joblib>=1.3",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
