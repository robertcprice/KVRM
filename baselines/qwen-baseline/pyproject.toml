[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-baseline"
version = "0.1.0"
description = "Qwen-class small-LM baseline for KVRM comparison benchmarks"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
transformers = [
    "transformers>=4.40",
    "torch>=2.0",
    "peft>=0.10",
]
