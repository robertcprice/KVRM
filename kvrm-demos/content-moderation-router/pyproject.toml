[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-moderation-router"
version = "0.1.0"
description = "Content moderation router demo built on KVRM core with intentional overlap zones"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["kvrm-core"]

[tool.setuptools.packages.find]
where = ["."]
