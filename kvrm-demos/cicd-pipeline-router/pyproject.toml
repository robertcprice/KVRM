[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cicd-pipeline-router"
version = "0.1.0"
description = "CI/CD pipeline routing demo built on KVRM core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["kvrm-core"]

[tool.setuptools.packages.find]
where = ["."]
